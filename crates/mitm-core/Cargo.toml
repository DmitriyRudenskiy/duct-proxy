[package]
name = "mitm-core"
version = "0.1.0"
edition = "2024"
description = "Core data models: Flow, Connection, Headers for MITM proxy"
license = "MIT"
repository = "https://github.com/mitmproxy-rs/mitmproxy-rs"
keywords = ["proxy", "mitm", "http"]
categories = ["network-programming"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
sha2 = { workspace = true }
hex = { workspace = true }
x509-parser = { workspace = true }
pem = { workspace = true }
