[package]
name = "mitm-certs"
version = "0.1.0"
edition = "2024"
description = "CA certificate management, CertStore, leaf certificate generation"
license = "MIT"
repository = "https://github.com/mitmproxy-rs/mitmproxy-rs"
keywords = ["proxy", "mitm", "tls", "certificate"]
categories = ["cryptography"]

[dependencies]
rcgen = { workspace = true }
x509-parser = { workspace = true }
pem = { workspace = true }
pkcs8 = { workspace = true }
time = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = "2"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"
