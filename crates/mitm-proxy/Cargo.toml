[package]
name = "mitm-proxy"
version = "0.1.0"
edition = "2024"
description = "Proxy server, TLS interception, HTTP/HTTPS forwarding"
license = "MIT"
repository = "https://github.com/mitmproxy-rs/mitmproxy-rs"
keywords = ["proxy", "mitm", "tls", "http"]
categories = ["network-programming"]

[dependencies]
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
mitm-core = { path = "../mitm-core" }
mitm-net = { path = "../mitm-net" }
mitm-certs = { path = "../mitm-certs" }
mitm-addons = { path = "../mitm-addons" }
mitm-options = { path = "../mitm-options" }
thiserror = "2"
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
async-trait = "0.1"
pem = "3"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
