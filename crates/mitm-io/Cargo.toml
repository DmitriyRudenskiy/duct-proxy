[package]
name = "mitm-io"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
mitm-core = { path = "../mitm-core" }
mitm-proxy = { path = "../mitm-proxy" }
thiserror = "2"
tracing = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
mitm-net = { path = "../mitm-net" }
