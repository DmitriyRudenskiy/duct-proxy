[package]
name = "mitm-options"
version = "0.1.0"
edition = "2024"
description = "CLI options, config file loading, OptManager runtime management"
license = "MIT"
repository = "https://github.com/mitmproxy-rs/mitmproxy-rs"
keywords = ["proxy", "cli", "config"]
categories = ["command-line-interface"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6"
tracing = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile = "3"
